name: enhancer_model
seed: 42

model:
  mode: dirichlet
  model: cnn
  checkpoint_path: "" # train from scratch; not loading FM backbone
  alphabet_size: 4
  alpha_max: 2.0
  alpha_scale: 1.0
  fix_alpha: 1.0
  num_cls: 1
  cls_expanded_simplex: True
  hidden_dim: 128
  num_cnn_stacks: 5
  dropout: 0.1
  cls_free_guidance: False
  clean_data: False

dataset:
  name: gosai
  data_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sequence_data/enhancer_gosai_DRAKES/processed_data/gosai_all.csv
  seq_length: 200
  streaming: False
  train_size: 50000

loader:
  global_batch_size: 64
  eval_global_batch_size: 32
  batch_size: 64
  eval_batch_size: 32
  num_workers: 4
  pin_memory: True

# ---------- GIL-style masked separator ----------
# L = L_sta  +  lambda_reg * L_reg  +  beta_inv * L_inv
#
#   L_sta : x_st alone must predict y
#   L_reg : mask ratio close to rho, bimodal distribution
#   L_inv : V-REx variance across K-means-inferred envs on x_en
#
# Alternating optimisation:
#   - warmup_epochs : no env inference yet (pure ERM on x_st)
#   - every env_infer_every epochs, run K-means on x_en embeddings to refresh
#     the env centroids, then assign env ids per batch during the update pass
masked_separator:
  target_idx:
    null # null -> regress on mean(hepg2, k562, sknsh)
    # set 0 / 1 / 2 for a single cell line target
  beta_inv: 1.0 # V-REx penalty weight
  lambda_reg: 5.0 # mask regularisation weight (symmetric quadratic)
  lambda_bimodal: 0.0 # bimodal term weight; keep 0 during primary training
  init_rho: 0.3 # fixed target stable ratio (not learnable)
  num_envs: 3 # K for K-means env inference
  warmup_epochs: 5 # epochs with L_inv disabled
  env_infer_every: 1 # re-run K-means every N epochs
  kmeans_iters: 20
  kmeans_samples: 8192 # cap on samples used for K-means fit per epoch

train:
  num_epochs: 20
  lr: 0.0001
  batch_size: 64
  accumulate_grad_batches: 1

optim:
  weight_decay: 0.0
