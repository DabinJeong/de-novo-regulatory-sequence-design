name: enhancer_model
seed: 42

model:
  mode: dirichlet
  model: cnn
  checkpoint_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/workdir_from_DirichletFM/DNA_diri_target2_valOnTrain_noDropoutEval_2024-01-08_10-11-25/best.ckpt
  clean_data: False
  alphabet_size: 4
  alpha_max: 2.0
  alpha_scale: 1.0
  fix_alpha: 1.0
  num_cls: 1
  cls_expanded_simplex: True
  hidden_dim: 128
  num_cnn_stacks: 5
  dropout: 0.1
  cls_free_guidance: False

dataset:
  name: gosai
  data_path: /lustre/scratch126/cellgen/lotfollahi/dj16/data/sequence_data/enhancer_gosai_DRAKES/processed_data/gosai_all.csv
  seq_length: 200
  streaming: False

loader:
  global_batch_size: 64
  eval_global_batch_size: 32
  batch_size: 64
  eval_batch_size: 32
  num_workers: 4
  pin_memory: True

# ---------- GIL-style masked separator (trained via masked_separator_trainer) ----------
# Provides the reference mask M_ref used by the guided sampler for bounded
# guidance. Architectural fields (target_idx, num_envs, init_rho) must match
# the values used during training so MaskedSeparatorModel loads the checkpoint.
masked_separator:
  checkpoint_path: ./runs/masked_separator/masked_separator_best.ckpt
  target_idx: 0 # 0=hepg2, 1=k562, 2=sknsh (must match trainer)
  num_envs: 3 # K for K-means env inference (architectural)
  init_rho: 0.3 # target stable ratio used at init

# ---------- ensemble property predictor (mu_hat, sigma2_hat) ----------
ensemble:
  num_members: 5
  hidden_dim: 128
  depth: 4
  dropout: 0.1
  target_idx: 0 # 0=hepg2, 1=k562, 2=sknsh
  checkpoint_path: ./runs/ensemble/ensemble_best.ckpt

# ---------- inference-time guided velocity field ----------
# u* = u_t + alpha*grad mu_hat - beta*grad sigma2_hat - (1-sqrt(lambda))*grad log p_t
sampling:
  predictor: ddpm
  n_steps: 128
  flow_temp: 1.0
  prior_pseudocount: 0.1
  alpha_guidance: 1.0 # property guidance strength
  beta_uncertainty: 1.0 # activity-cliff penalty strength
  ood_lambda: 0.0 # 0 = in-distribution, ->1 = novelty / OOD push
  gamma_rank: 1.0 # ranking: -gamma * sigma_hat
  delta_rank: 0.0 # ranking: +delta * novelty(x)
  # 20 * eval_batch_size (32) = 640 samples, matching DRAKES / SVDD / DNA-Diffusion.
  # Currently informational; guided_sampler.py reads --num_batches from CLI.
  num_sample_batches: 20
  # ---- Upstream classifier-guided Sampler (scripts/sampler.py) ----
  # These fields are used ONLY by the upstream-style `Sampler` class,
  # not by the new `GuidedSampler`. Kept here to keep one config per
  # backbone instead of fragmenting across files.
  guidance_scale: 1.0 # mix weight between cls-guided flow and unconditional
  scale_cls_score: True # L2-rescale cls_score to match flow-score norm
  target_class: 0 # target class index for cross-entropy guidance

train:
  num_epochs: 5
  lr: 0.0001
  lr_step_size: 10
  lr_gamma: 0.5
  batch_size: 64
  accumulate_grad_batches: 1

eval:
  batch_size: 32

optim:
  weight_decay: 0.0
  lr: 0.0001
  beta1: 0.9
  beta2: 0.999
  eps: 0.00000001
